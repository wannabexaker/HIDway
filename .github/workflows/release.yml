# Publishes a GitHub release for an annotated vX.Y.Z tag on main: the
# Windows zip (client, probe, Setup.cmd, firmware), the firmware files and
# SHA256SUMS.txt. Everything is built and tested by ci.yml first; nothing is
# published if any job fails.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Annotated tag on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [[ $(git cat-file -t "refs/tags/$TAG") == tag ]] || { echo "::error::$TAG is not an annotated tag"; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }

  build:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          title=$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")
          {
            git for-each-ref --format='%(contents:body)' "refs/tags/$TAG"
            echo
            echo "**Windows** (the PC you play from, and the gaming PC): download"
            echo "\`HIDway-$TAG-windows.zip\`, unpack it and run \`Setup.cmd\`."
            echo
            echo "**Pico firmware:** \`hidway_fw_<board>.uf2\` for Pico, Pico W, Pico 2 and"
            echo "Pico 2 W. Hold BOOTSEL while plugging the Pico in, then copy the file to it."
            echo
            echo "**Raspberry Pi:** \`hidway-update\` installs this tag (docs/RELAY.md)."
            echo
            echo "SHA-256 checksums: \`SHA256SUMS.txt\`."
          } >notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "${title:-HIDway $TAG}" --notes-file notes.md
          fi
